		<script>
			window.onload = () => {
				// Fix Backbone history root for GitHub Pages subdirectory deployment
				var _origStart = Backbone.History.prototype.start;
				Backbone.History.prototype.start = function(options) {
					return _origStart.call(this, Object.assign({ root: '/pokemonshowdown/' }, options || {}));
				};
				window.app = new App();
				// crossdomain.php rejects non-psim.us hosts (GitHub Pages).
				// Manually trigger Storage.whenPrefsLoaded if the cross-origin
				// iframe mechanism doesn't respond within 1 second.
				setTimeout(function() {
					if (!Storage.whenPrefsLoaded.isLoaded) {
						Storage.whenPrefsLoaded.load();
					}
					if (!Storage.whenTeamsLoaded.isLoaded) {
						Storage.whenTeamsLoaded.load();
					}
				}, 1000);
				// 한국어 포켓몬 이름으로 인한 아이콘 표시 오류 수정
				// toID()가 한국어 문자를 제거하므로 BattleAliases를 통해 영어 ID로 변환
				setTimeout(function() {
					if (typeof Dex !== 'undefined' && Dex.getPokemonIcon) {
						var _origGetIcon = Dex.getPokemonIcon.bind(Dex);
						Dex.getPokemonIcon = function(pokemon, facingLeft) {
							if (pokemon && window.BattleAliases) {
								var species = null;
								if (typeof pokemon === 'object' && pokemon !== null) {
									species = pokemon.speciesForme || pokemon.species || null;
								} else if (typeof pokemon === 'string') {
									species = pokemon;
								}
								if (species) {
									// toID 결과가 비어 있으면 (한국어 이름) BattleAliases에서 조회
									var id = species.toLowerCase().replace(/[^a-z0-9]+/g, '');
									if (!id) {
										var koKey = species.toLowerCase().replace(/[^a-z0-9\uAC00-\uD7A3\u3131-\u318E\u314F-\u3163]+/g, '');
										var englishId = window.BattleAliases[koKey];
										if (englishId) {
											if (typeof pokemon === 'object') {
												pokemon = Object.assign({}, pokemon, { species: englishId, speciesForme: englishId });
											} else {
												pokemon = englishId;
											}
										}
									}
								}
							}
							return _origGetIcon(pokemon, facingLeft);
						};
					}
				}, 4000);
			}
		</script>
